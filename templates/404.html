{% extends "base.html" %}

{% block title %}{{ t.errors['404'].title }} - {{ blog_name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-lg-6 mx-auto text-center">
        <div class="py-5">
            <i class="fas fa-exclamation-triangle error-icon"></i>
            <h1 class="display-1 fw-bold mt-4">404</h1>
            <h2 class="mb-4">{{ t.errors['404'].title }}</h2>
            <p class="lead mb-4">{{ t.errors['404'].message }}</p>
            <a href="/{{ lang }}" class="btn btn-primary btn-lg">
                <i class="fas fa-home"></i> {{ t.errors['404'].go_home }}
            </a>
        </div>
    </div>
</div>
{% endblock %}
